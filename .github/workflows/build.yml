name: Build Yo-kai Editor 1

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Application
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 5.15.2 (MinGW 8.1 64-bit)
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: 'win64_mingw81'

      - name: Build Project
        shell: cmd
        run: |
          lrelease Yo-kai_Editor_1.pro
          qmake Yo-kai_Editor_1.pro CONFIG+=release
          mingw32-make -j%NUMBER_OF_PROCESSORS%

      - name: Prepare Release Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist"
          Copy-Item "release/Yo-kai Editor 1.exe" "dist/"
          Copy-Item "README.txt", "LICENSE.txt", "AUTHORS.txt", "CHANGELOG.txt" "dist/"

          $qtBin = (qmake -query QT_INSTALL_BINS).Trim()
          $qtPlugins = (qmake -query QT_INSTALL_PLUGINS).Trim()
          $gccPath = Split-Path (Get-Command g++).Source

          Write-Host "Gathering Qt core libraries from $qtBin"
          Get-ChildItem -Path $qtBin -Include "Qt5Core.dll", "Qt5Gui.dll", "Qt5Widgets.dll" -File | Copy-Item -Destination "dist/" -Force

          Write-Host "Gathering plugins from $qtPlugins"
          Copy-Item "$qtPlugins/platforms" "dist/" -Recurse -Force
          if (Test-Path "$qtPlugins/styles") { Copy-Item "$qtPlugins/styles" "dist/" -Recurse -Force }

          Write-Host "Gathering MinGW compiler runtime libraries"
          Get-ChildItem -Path $gccPath, $qtBin -Include "libgcc_s_seh-1.dll", "libstdc++-6.dll", "libwinpthread-1.dll" -File | Copy-Item -Destination "dist/" -Force

          Write-Host "Files packaged successfully:"
          Get-ChildItem "dist" -Recurse | Select-Object FullName

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yo-kai_Editor_1_Windows
          path: dist/
