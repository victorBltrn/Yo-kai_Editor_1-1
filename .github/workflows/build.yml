name: Build Yo-kai Editor 1

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Application
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 5.15.2 (MinGW 8.1 64-bit)
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: 'win64_mingw81'

      - name: Build Project
        shell: cmd
        run: |
          lrelease Yo-kai_Editor_1.pro
          qmake Yo-kai_Editor_1.pro CONFIG+=release
          mingw32-make -j%NUMBER_OF_PROCESSORS%

      - name: Prepare Release Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/platforms"
          Copy-Item "release/Yo-kai Editor 1.exe" "dist/"
          Copy-Item "README.txt", "LICENSE.txt", "AUTHORS.txt", "CHANGELOG.txt" "dist/"

          $qtBin = (qmake -query QT_INSTALL_BINS).Trim()
          $qtPlugins = (qmake -query QT_INSTALL_PLUGINS).Trim()
          $gccPath = Split-Path (Get-Command g++).Source

          Write-Host "Qt Bin: $qtBin"
          Write-Host "Qt Plugins: $qtPlugins"
          Write-Host "GCC Path: $gccPath"

          # Copy Qt Core DLLs
          $qtDlls = @("Qt5Core.dll", "Qt5Gui.dll", "Qt5Widgets.dll", "Qt5Svg.dll")
          foreach ($dll in $qtDlls) {
              if (Test-Path "$qtBin/$dll") {
                  Copy-Item "$qtBin/$dll" "dist/" -Force
                  Write-Host "Copied $dll"
              }
          }

          # Copy Platform & Style plugins
          Copy-Item "$qtPlugins/platforms/*" "dist/platforms/" -Recurse -Force
          if (Test-Path "$qtPlugins/styles") {
              New-Item -ItemType Directory -Force -Path "dist/styles"
              Copy-Item "$qtPlugins/styles/*" "dist/styles/" -Recurse -Force
          }

          # Copy MinGW compiler runtime DLLs
          $minGwDlls = @("libgcc_s_seh-1.dll", "libstdc++-6.dll", "libwinpthread-1.dll")
          foreach ($dll in $minGwDlls) {
              if (Test-Path "$gccPath/$dll") {
                  Copy-Item "$gccPath/$dll" "dist/" -Force
                  Write-Host "Copied $dll from GCC folder"
              } elseif (Test-Path "$qtBin/$dll") {
                  Copy-Item "$qtBin/$dll" "dist/" -Force
                  Write-Host "Copied $dll from Qt bin folder"
              } else {
                  $found = Get-ChildItem -Path "C:\", "D:\" -Filter $dll -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
                  if ($found) {
                      Copy-Item $found.FullName "dist/" -Force
                      Write-Host "Copied $dll from $($found.FullName)"
                  }
              }
          }

          Write-Host "=== All Files Packaged in dist ==="
          Get-ChildItem "dist" -Recurse | Select-Object Name, Length

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yo-kai_Editor_1_Windows
          path: dist/
